<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MV Clan</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#070a16;
      color:white;
      overflow-x:hidden;
    }

    /* MIST GLOW BACKGROUND */
    body::before{
      content:"";
      position:fixed;
      width:100%;
      height:100%;
      background:
        radial-gradient(circle at 20% 30%, rgba(56,189,248,0.25), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(168,85,247,0.25), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(14,165,233,0.15), transparent 60%);
      filter: blur(25px);
      z-index:-3;
    }

    body::after{
      content:"";
      position:fixed;
      width:100%;
      height:100%;
      background: linear-gradient(-45deg,#070a16,#0b1020,#1e1b4b,#0ea5e9,#9333ea);
      background-size:400% 400%;
      animation: moveBg 12s ease infinite;
      opacity:0.55;
      z-index:-2;
    }

    @keyframes moveBg{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    header{
      padding:20px 40px;
    }

    .logo{
      font-size:26px;
      font-weight:bold;
      text-shadow:0 0 15px #38bdf8;
    }

    /* HERO */
    .hero{
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
    }

    .circle{
      width:130px;
      height:130px;
      border-radius:50%;
      border:2px solid rgba(56,189,248,0.6);
      box-shadow:0 0 20px #38bdf8,0 0 50px #9333ea;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
      animation:pulse 2s infinite;
      margin-bottom:20px;
      text-align:center;
    }

    @keyframes pulse{
      50%{transform:scale(1.08);}
    }

    .hero h1{
      font-size:42px;
      animation: fadeUp 1s ease;
    }

    @keyframes fadeUp{
      from{opacity:0; transform:translateY(20px);}
      to{opacity:1; transform:translateY(0);}
    }

    .btn{
      margin-top:25px;
      padding:12px 28px;
      border:none;
      border-radius:30px;
      background:#38bdf8;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.1);
    }

    /* OVERLAY */
    .overlay{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.85);
      display:none;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .overlay.show{
      display:flex;
    }

    .panel{
      width:100%;
      max-width:500px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
      padding:25px;
      border-radius:15px;
      text-align:center;
      animation:pop 0.4s ease;
    }

    @keyframes pop{
      from{transform:scale(0.7); opacity:0;}
      to{transform:scale(1); opacity:1;}
    }

    .hero.hide{
      display:none;
    }

    .inside{
      display:none;
      height:100vh;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
      animation:fadeUp 1s ease;
    }

    .inside.show{
      display:flex;
    }

    .telegram{
      margin-top:25px;
      line-height:2;
      font-size:16px;
    }

    a{
      color:#38bdf8;
      text-decoration:none;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">MV</div>
</header>

<!-- HERO -->
<div class="hero" id="hero">

  <div class="circle">MIST<br>VORTEX</div>

  <h1>Welcome to MIST VORTEX</h1>

  <button class="btn" onclick="openRules()">Join</button>
</div>

<!-- RULES -->
<div class="overlay" id="overlay">
  <div class="panel">
    <h2>Clan Rules</h2>
    <p>1. No leak information</p>
    <p>2. No fighting or causing conflicts</p>
    <p>3. Minimum 10 kills required for clan test</p>

    <button class="btn" onclick="enterClan()">OK</button>
  </div>
</div>

<!-- INSIDE -->
<div class="inside" id="inside">
  <h1>Welcome Member of MV</h1>

  <div class="telegram">
    Telegram<br><br>
    Mobile tester - <a href="https://t.me/Rukiamiko" target="_blank">@Rukiamiko</a><br>
    PC tester - <a href="https://t.me/zzzthisnotme" target="_blank">@zzzthisnotme</a>
  </div>
</div>

<script>
function openRules(){
  document.getElementById("overlay").classList.add("show");
}

function enterClan(){
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("hero").classList.add("hide");
  document.getElementById("inside").classList.add("show");
}
</script>

</body>
</html>
